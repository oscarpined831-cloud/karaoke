name: Build VoxEngine APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Garantizar Gradle Wrapper y Permisos
      run: |
        if [ ! -f gradlew ]; then
          echo "[*] gradlew no detectado. Generando wrapper con Gradle del sistema..."
          gradle wrapper --gradle-version 8.5
        fi
        chmod +x gradlew

    - name: Compilar APK Debug con C++ Nativo
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Empaquetar Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: VoxEngine-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 2
